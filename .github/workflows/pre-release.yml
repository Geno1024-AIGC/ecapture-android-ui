name: Android pre-release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      head_sha: ${{ steps.version.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Materialize keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          chmod 600 "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APK
        env:
          KEYSTORE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare artifact
        id: version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          version_name="$(./gradlew -q :printVersion)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          head_sha="$(git rev-parse HEAD)"
          file_name="ecapture-android-ui-${version_name}-${short_sha}.apk"
          mkdir -p dist
          cp "$apk" "dist/$file_name"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Built $file_name"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist -maxdepth 1 -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi
          tag="$VERSION_NAME"
          notes=$(cat <<EOF
          Automated pre-release from master.

          - version: \`$VERSION_NAME\`
          - commit: \`$SHORT_SHA\`
          - run: $GITHUB_RUN_NUMBER

          Requires root on device and a compatible ecapture binary (download/import in app). APK is signed with the org shared keystore when secrets are configured.
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "ecapture-android-ui $VERSION_NAME" --notes "$notes"
            gh release upload "$tag" "${apks[0]}" --clobber
          else
            gh release create "$tag" "${apks[0]}" --prerelease --title "ecapture-android-ui $VERSION_NAME" --notes "$notes" --target "$GITHUB_SHA"
          fi
